<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Brand Gradient matching the Word Splash button and accent glow -->
    <linearGradient id="featherGrad" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#9333EA" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Ink Splash Trail Gradient -->
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B36F0" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <!-- Soft ambient background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F3FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#EDE9FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EDE9FE" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B36F0" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    .quill-spine {
      stroke: url(#featherGrad);
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .splash-trail {
      stroke: url(#splashGrad);
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>

  <!-- Ambient Glow Background Badge -->
  <circle cx="100" cy="100" r="88" fill="url(#bgGlow)" />
  <circle cx="100" cy="100" r="80" fill="#FAF5FF" stroke="#F3E8FF" stroke-width="1.5" />

  <!-- ICON EMBLEM: FEATHER QUILL + CALLIGRAPHIC INK SPLASH -->
  <g filter="url(#markShadow)">
    <!-- Feather Silhouette / Outer Vane Contour -->
    <path d="M 148,34 
             C 142,48 130,58 120,62 
             C 134,67 138,79 127,90 
             C 119,98 107,100 100,102 
             C 112,110 114,121 101,130 
             C 91,137 78,138 72,136 
             C 70,126 73,116 78,107 
             C 69,104 63,94 66,81 
             C 70,69 78,64 85,63 
             C 73,55 76,41 87,30 
             C 99,18 118,13 148,34 Z" 
          stroke="url(#featherGrad)" stroke-width="5" stroke-linejoin="round"
          fill="rgba(168, 85, 247, 0.08)" />

    <!-- Feather Central Spine / Quill Shaft -->
    <path d="M 68,138 C 72,112 85,76 116,46 C 130,32 142,26 148,34" 
          class="quill-spine" stroke-width="5.5" />

    <!-- Delicate Inner Barb Strokes -->
    <path d="M 118,50 C 105,58 99,65 97,71" class="quill-spine" stroke-width="3.5" opacity="0.85" />
    <path d="M 103,80 C 92,87 88,94 87,100" class="quill-spine" stroke-width="3.5" opacity="0.85" />

    <!-- Fluid Calligraphic Ink Wave / Signature Splash emanating from nib -->
    <path d="M 68,138 
             C 60,152 48,162 38,161 
             C 29,160 26,149 35,142 
             C 44,134 56,135 64,144 
             C 72,154 82,165 96,162 
             C 110,158 119,139 130,140 
             C 139,141 142,155 152,155 
             C 161,155 168,149 174,149" 
          class="splash-trail" stroke-width="5" />

    <!-- Dynamic Splash Droplets -->
    <circle cx="28" cy="130" r="4.5" fill="#8B36F0" />
    <circle cx="42" cy="116" r="3" fill="#A855F7" />
    <circle cx="140" cy="122" r="4" fill="#9333EA" />
    <circle cx="156" cy="110" r="2.8" fill="#C084FC" />
    <circle cx="166" cy="138" r="3.2" fill="#E879F9" />
  </g>
</svg>